<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900">
  <rect width="1560" height="900" fill="#f4f7fb"/>
  <text x="40" y="58" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="33" font-weight="700" fill="#10233f">ChaLi · Execution</text>
  <text x="40" y="95" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="19" fill="#4a5b73">Desktop and embedded Linux hosts share the same VM core</text>
  <rect x="40" y="145" width="440" height="120" rx="15" fill="#ffffff" stroke="#d8e1ee" stroke-width="1"/>
  <text x="260" y="175" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#14507e" text-anchor="middle" dominant-baseline="central">.chl / in-memory Program</text>
  <text x="260" y="205" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Compile source, then enter the VM</text>
  <text x="260" y="235" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Lower internal instructions in memory</text>
  <rect x="560" y="145" width="440" height="120" rx="15" fill="#ffffff" stroke="#d8e1ee" stroke-width="1"/>
  <text x="780" y="175" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#14507e" text-anchor="middle" dominant-baseline="central">.svmb · format 5</text>
  <text x="780" y="205" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Read and validate code + metadata</text>
  <text x="780" y="235" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Use the stored internal sequence</text>
  <rect x="1080" y="145" width="440" height="120" rx="15" fill="#ffffff" stroke="#d8e1ee" stroke-width="1"/>
  <text x="1300" y="175" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#14507e" text-anchor="middle" dominant-baseline="central">VM host configuration</text>
  <text x="1300" y="205" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Native registry and memory budget</text>
  <text x="1300" y="235" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Input / output and peripherals</text>
  <polyline points="260,265 260,320" fill="none" stroke="#8ea2bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="260,320 255,309 265,309" fill="#8ea2bb"/>
  <polyline points="780,265 780,320" fill="none" stroke="#8ea2bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="780,320 775,309 785,309" fill="#8ea2bb"/>
  <polyline points="1300,265 1300,320" fill="none" stroke="#8ea2bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1300,320 1295,309 1305,309" fill="#8ea2bb"/>
  <rect x="40" y="320" width="1480" height="120" rx="15" fill="#eaf6ef" stroke="#bfe0cc" stroke-width="1"/>
  <text x="780" y="350" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#14507e" text-anchor="middle" dominant-baseline="central">VM execution preparation</text>
  <text x="780" y="380" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Bind symbols / jumps / natives; allocate per-function continuous slots</text>
  <text x="780" y="410" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">16-bit local register IDs; wide-slot fallback for oversized functions</text>
  <polyline points="400,440 400,510" fill="none" stroke="#8ea2bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="400,510 395,499 405,499" fill="#8ea2bb"/>
  <polyline points="1160,440 1160,510" fill="none" stroke="#8ea2bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1160,510 1155,499 1165,499" fill="#8ea2bb"/>
  <rect x="40" y="510" width="720" height="120" rx="15" fill="#eaf6ef" stroke="#bfe0cc" stroke-width="1"/>
  <text x="400" y="540" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#14507e" text-anchor="middle" dominant-baseline="central">Internal instruction path</text>
  <text x="400" y="570" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Integer register control-flow regions</text>
  <text x="400" y="600" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Independent loop; periodic safe points</text>
  <rect x="800" y="510" width="720" height="120" rx="15" fill="#ffffff" stroke="#d8e1ee" stroke-width="1"/>
  <text x="1160" y="540" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#14507e" text-anchor="middle" dominant-baseline="central">Precise fallback path</text>
  <text x="1160" y="570" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Dynamic values / debug / hooks</text>
  <text x="1160" y="600" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Step, stack and async boundaries</text>
  <polyline points="400,630 400,665" fill="none" stroke="#8ea2bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="400,665 395,654 405,654" fill="#8ea2bb"/>
  <polyline points="1160,630 1160,665" fill="none" stroke="#8ea2bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1160,665 1155,654 1165,654" fill="#8ea2bb"/>
  <rect x="40" y="665" width="1480" height="60" rx="15" fill="#ffffff" stroke="#d8e1ee" stroke-width="1"/>
  <text x="780" y="695" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#14507e" text-anchor="middle" dominant-baseline="central">Update PC → dispatch next instruction / return / stop</text>
  <polyline points="780,725 780,770" fill="none" stroke="#8ea2bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="780,770 775,759 785,759" fill="#8ea2bb"/>
  <rect x="40" y="770" width="1480" height="90" rx="15" fill="#ffffff" stroke="#d8e1ee" stroke-width="1"/>
  <text x="780" y="800" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#14507e" text-anchor="middle" dominant-baseline="central">Runtime services during execution; output and cleanup at exit</text>
  <text x="780" y="830" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Data / heap · host natives · I/O · drop · error reporting</text>
</svg>
