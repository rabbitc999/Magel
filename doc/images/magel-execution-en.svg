  <polygon points="780,665 775,654 785,654" fill="#8ea2bb"/>
  <rect x="40" y="665" width="960" height="60" rx="15" fill="#ffffff" stroke="#d8e1ee" stroke-width="1"/>
  <text x="520" y="695" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#14507e" text-anchor="middle" dominant-baseline="central">Update PC → dispatch next instruction / return / stop</text>
  <polyline points="520,725 520,770" fill="none" stroke="#8ea2bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="520,770 515,759 525,759" fill="#8ea2bb"/>
  <polyline points="1300,440 1300,770" fill="none" stroke="#8ea2bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1300,770 1295,759 1305,759" fill="#8ea2bb"/>
  <rect x="40" y="770" width="1480" height="90" rx="15" fill="#ffffff" stroke="#d8e1ee" stroke-width="1"/>
  <text x="780" y="800" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#14507e" text-anchor="middle" dominant-baseline="central">Runtime services during execution; output and cleanup at exit</text>
  <text x="780" y="830" font-family="Microsoft YaHei, Segoe UI, Noto Sans SC, sans-serif" font-size="18" fill="#4a5b73" text-anchor="middle" dominant-baseline="central">Data / heap · host natives · I/O · drop / delete · error reporting</text>
</svg>
