<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAGEL 学生信息管理</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #172b46; background: #f3f6fa; }
    body { margin: 0; } main { max-width: 1100px; margin: 36px auto; padding: 0 20px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { font-size: 28px; margin-bottom: 8px; } .subtitle { color: #5c6f86; }
    .panel { background: white; border: 1px solid #dce4ee; border-radius: 12px; padding: 24px; margin: 24px 0; }
    h2 { margin-top: 0; font-size: 19px; } form { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    label { display: grid; gap: 8px; font-size: 14px; } input { min-width: 0; padding: 10px; border: 1px solid #bac9db; border-radius: 6px; font: inherit; }
    button { border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; background: #155dd7; color: white; font: inherit; }
    button:disabled { opacity: .6; cursor: wait; } .secondary { background: #eaf0f8; color: #17416f; }
    .danger { background: #fff0f0; color: #af2525; } .actions { grid-column: 1 / -1; display: flex; gap: 10px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .table-wrap { overflow-x: auto; } table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 13px 10px; border-bottom: 1px solid #e7edf4; white-space: nowrap; }
    th { color: #52677f; font-size: 13px; } td:last-child { display: flex; gap: 8px; }
    #message { min-height: 24px; color: #245d39; } #message.error { color: #b12424; }
    #empty { color: #687c94; padding: 24px; text-align: center; } small { color: #687c94; }
    @media (max-width: 760px) { form { grid-template-columns: 1fr 1fr; } header, .toolbar { align-items: flex-start; flex-direction: column; } }
    @media (max-width: 440px) { form { grid-template-columns: 1fr; } .panel { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>学生信息管理</h1><div class="subtitle">维护学生档案，保存后立即更新列表。</div></div>
      <button id="refresh" class="secondary" type="button">刷新列表</button>
    </header>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">新增学生</h2>
      <form id="student-form">
        <label>学号<input name="studentNo" required maxlength="32" autocomplete="off"></label>
        <label>姓名<input name="name" required maxlength="40" autocomplete="name"></label>
        <label>邮箱<input name="email" type="email" required maxlength="160" autocomplete="email"></label>
        <label>年龄<input name="age" type="number" required min="0" max="150" step="1" value="18"></label>
        <div class="actions"><button id="save" type="submit">保存学生</button><button id="cancel" class="secondary" type="button" hidden>取消编辑</button></div>
      </form>
    </section>
    <div id="message" role="status" aria-live="polite"></div>
    <section class="panel" aria-labelledby="list-title">
      <div class="toolbar"><h2 id="list-title">学生列表 <small id="count"></small></h2><label>搜索当前列表<input id="search" type="search" placeholder="输入姓名、学号或邮箱"></label></div>
      <div class="table-wrap"><table><thead><tr><th>学号</th><th>姓名</th><th>邮箱</th><th>年龄</th><th>操作</th></tr></thead><tbody id="students"></tbody></table></div>
      <div id="empty" hidden>暂无匹配的学生，请新增档案。</div>
      <p><small>列表最多显示 200 条，按创建顺序排列。</small></p>
    </section>
  </main>
  <script>
    'use strict';
    const form = document.getElementById('student-form');
    const message = document.getElementById('message');
    let records = [];
    let editingId = null;
    function notify(text, error = false) {
      message.textContent = text;
      message.classList.toggle('error', error);
    }
    async function api(path, method = 'GET', body) {
      const options = {method};
      if (body !== undefined) {
        options.headers = {'Content-Type': 'application/json'};
        options.body = JSON.stringify(body);
      }
      const response = await fetch(path, options);
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || `请求失败 (${response.status})`);
      return result;
    }
    function resetForm() {
      editingId = null;
      form.reset();
      document.getElementById('form-title').textContent = '新增学生';
      document.getElementById('cancel').hidden = true;
    }
    function render() {
      const tbody = document.getElementById('students');
      const query = document.getElementById('search').value.trim().toLowerCase();
      const visible = records.filter(row => [row.studentNo, row.name, row.email].some(value => value.toLowerCase().includes(query)));
      tbody.textContent = '';
      document.getElementById('count').textContent = `(${visible.length} / ${records.length})`;
      document.getElementById('empty').hidden = visible.length > 0;
      for (const row of visible) {
        const tr = document.createElement('tr');
        for (const value of [row.studentNo, row.name, row.email, row.age]) {
          const td = document.createElement('td');
          td.textContent = value;
          tr.append(td);
        }
        const actions = document.createElement('td');
        const edit = document.createElement('button');
        edit.type = 'button'; edit.className = 'secondary'; edit.textContent = '编辑';
        edit.addEventListener('click', () => {
          editingId = row.id;
          for (const key of ['studentNo', 'name', 'email', 'age']) form.elements.namedItem(key).value = row[key];
          document.getElementById('form-title').textContent = `编辑学生 · ${row.studentNo}`;
          document.getElementById('cancel').hidden = false;
          form.elements.namedItem('studentNo').focus();
        });
        const remove = document.createElement('button');
        remove.type = 'button'; remove.className = 'danger'; remove.textContent = '删除';
        remove.addEventListener('click', async () => {
          if (!confirm(`确定删除 ${row.name} (${row.studentNo})？`)) return;
          remove.disabled = true;
          try {
            await api(`/api/students/${row.id}`, 'DELETE');
            if (editingId === row.id) resetForm();
            await reload(); notify('学生已删除。');
          } catch (error) { notify(error.message, true); remove.disabled = false; }
        });
        actions.append(edit, remove); tr.append(actions); tbody.append(tr);
      }
    }
    async function reload() { records = await api('/api/students'); render(); }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const save = document.getElementById('save'); save.disabled = true;
      const data = Object.fromEntries(new FormData(form)); data.age = Number(data.age);
      try {
        await api(editingId === null ? '/api/students' : `/api/students/${editingId}`, editingId === null ? 'POST' : 'PUT', data);
        resetForm(); await reload(); notify('学生信息已保存。');
      } catch (error) { notify(error.message, true); }
      finally { save.disabled = false; }
    });
    document.getElementById('cancel').addEventListener('click', resetForm);
    document.getElementById('search').addEventListener('input', render);
    document.getElementById('refresh').addEventListener('click', () => reload().then(() => notify('列表已刷新。')).catch(error => notify(error.message, true)));
    reload().catch(error => notify(error.message, true));
  </script>
</body>
</html>
